{{template "header" .}}
<h2>Редактировать трату</h2>

<form method="POST" action="/edit/save">
	<input type="hidden" name="id" value="{{.Expense.ID}}">
	<p>
		<label>Сумма: <input type="number" name="amount" step="0.01" min="0" value="{{.Expense.Amount}}" required></label>
	</p>
	<p>
		<label>Описание: <input type="text" name="description" value="{{.Expense.Description}}" required></label>
	</p>
	<p>
		<label>Дата: <input type="date" name="date" value="{{.Expense.Date}}" required></label>
	</p>
	<p>
		<label>Категория:
			<select name="category_id" required>
				{{range .Categories}}
				<option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>{{.Name}}</option>
				{{end}}
			</select>
		</label>
	</p>
	<p>
		<button type="submit">Сохранить</button>
	</p>
</form>

<p><a href="/">← Вернуться к списку</a></p>

{{template "footer" .}}
