{{template "header" .}}
<h2>Список трат</h2>

{{if .}}
<table>
	<thead>
		<tr>
			<th>ID</th>
			<th>Сумма</th>
			<th>Описание</th>
			<th>Дата</th>
			<th>Действия</th>
		</tr>
	</thead>
	<tbody>
		{{range .}}
		<tr>
			<td>{{.ID}}</td>
			<td>{{.Amount}}</td>
			<td>{{.Description}}</td>
			<td>{{.Date}}</td>
			<td>
				<a href="/edit?id={{.ID}}">Ред.</a>
				<form method="POST" action="/delete" style="display:inline" onsubmit="return confirm('Удалить трату?');">
					<input type="hidden" name="id" value="{{.ID}}">
					<button type="submit">Удалить</button>
				</form>
			</td>
		</tr>
		{{end}}
	</tbody>
</table>
{{else}}
<p>Пока нет ни одной траты. <a href="/add">Добавьте первую</a>.</p>
{{end}}

{{template "footer" .}}
