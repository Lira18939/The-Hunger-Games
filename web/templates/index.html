{{template "header" .}}
<h2>Список трат</h2>

<form method="GET" action="/">
	<label>Категория:
		<select name="category">
			<option value="0">Все</option>
			{{range .Categories}}
			<option value="{{.ID}}" {{if eq .ID $.CategoryID}}selected{{end}}>{{.Name}}</option>
			{{end}}
		</select>
	</label>
	<label>С: <input type="date" name="from" value="{{.DateFrom}}"></label>
	<label>По: <input type="date" name="to" value="{{.DateTo}}"></label>
	<button type="submit">Фильтр</button>
	<a href="/">Сбросить</a>
</form>

{{if .Expenses}}
<table>
	<thead>
		<tr>
			<th>ID</th>
			<th>Сумма</th>
			<th>Описание</th>
			<th>Дата</th>
			<th>Категория</th>
			<th>Действия</th>
		</tr>
	</thead>
	<tbody>
		{{range .Expenses}}
		<tr>
			<td>{{.ID}}</td>
			<td>{{.Amount}}</td>
			<td>{{.Description}}</td>
			<td>{{.Date}}</td>
			<td>{{.CategoryName}}</td>
			<td>
				<a href="/edit?id={{.ID}}">Ред.</a>
				<form method="POST" action="/delete" style="display:inline" onsubmit="return confirm('Удалить трату?');">
					<input type="hidden" name="id" value="{{.ID}}">
					<button type="submit">Удалить</button>
				</form>
			</td>
		</tr>
		{{end}}
	</tbody>
</table>
{{else}}
<p>Пока нет ни одной траты. <a href="/add">Добавьте первую</a>.</p>
{{end}}

{{template "footer" .}}
