{{define "content"}}
<h1>{{if .IsEdit}}Редактирование траты{{else}}Новая трата{{end}}</h1>

{{if .Error}}<div class="error">{{.Error}}</div>{{end}}

<form method="POST"
      action="{{if .IsEdit}}/expenses/{{.ID}}{{else}}/expenses{{end}}"
      class="expense-form">
    <label>Сумма:
        <input type="number" step="0.01" min="0.01"
               name="amount" value="{{.Amount}}" required>
    </label>
    <label>Описание:
        <input type="text" name="description" value="{{.Description}}" required>
    </label>
    <label>Дата:
        <input type="date" name="date" value="{{.Date}}" required>
    </label>
    <label>Категория:
        <select name="category_id">
            <option value="">— без категории —</option>
            {{range .Categories}}
                <option value="{{.ID}}"
                    {{if eq $.SelectedCategory .ID}}selected{{end}}>
                    {{.Name}}
                </option>
            {{end}}
        </select>
    </label>
    <div class="form-actions">
        <button type="submit">Сохранить</button>
        <a class="button secondary" href="/expenses">Отмена</a>
    </div>
</form>
{{end}}
